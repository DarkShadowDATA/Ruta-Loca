<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15171b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ruta Loca</title>
<style>
  html, body { margin: 0; height: 100%; background: #15171b; overflow: hidden; overscroll-behavior: none; font-family: "Arial Black", "Arial Bold", Impact, system-ui, sans-serif; }
  body { background: radial-gradient(ellipse at center, #4a4436 0%, #1d1b17 55%, #121212 100%); }
  #game { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  /* Interfaz: mide 720×1280 como el juego y se escala encima del lienzo */
  #ui { position: fixed; left: 0; top: 0; width: 720px; height: 1280px; transform-origin: 0 0; pointer-events: none; color: #fff; }
  .scr { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; pointer-events: auto; }
  .scr.on { display: flex; }
  .shade { background: rgba(10, 8, 6, .62); }
  .logo { margin-top: 150px; font-size: 128px; line-height: .86; text-align: center; color: #ffd84a; letter-spacing: 2px;
    text-shadow: 0 8px 0 #1b1410, 6px 0 0 #1b1410, -6px 0 0 #1b1410, 0 -6px 0 #1b1410, 0 14px 22px rgba(0,0,0,.6); transform: rotate(-4deg); }
  .logo span { display: block; color: #ff8a3c; transform: translateX(40px) scale(1.08); }
  .ruta { margin-top: 44px; background: #1b1410; border: 5px solid #ffd84a; border-radius: 22px; padding: 12px 26px; font-size: 30px; color: #ffd84a; }
  .ruta small { display: block; font-family: system-ui, sans-serif; font-weight: 700; font-size: 22px; color: #e9e6dc; }
  .stats { margin-top: 26px; display: flex; gap: 22px; font-size: 32px; }
  .pill { background: rgba(27,20,16,.85); border-radius: 40px; padding: 10px 26px; border: 4px solid rgba(255,255,255,.18); }
  .btn { pointer-events: auto; border: 0; cursor: pointer; font-family: inherit; color: #1b1410; background: #ffd84a; border-radius: 34px;
    box-shadow: 0 9px 0 #a8761a, 0 14px 24px rgba(0,0,0,.45); font-size: 66px; padding: 22px 80px; margin-top: 34px; }
  .btn:active { transform: translateY(6px); box-shadow: 0 3px 0 #a8761a; }
  .btn.sec { font-size: 36px; padding: 18px 40px; background: #f4f1e6; box-shadow: 0 7px 0 #9a958a, 0 12px 20px rgba(0,0,0,.4); }
  .row { display: flex; gap: 22px; margin-top: 10px; }
  .ver { position: absolute; right: 16px; bottom: 12px; font: 600 20px system-ui, sans-serif; opacity: .5; }
  .over-t { margin-top: 230px; font-size: 84px; color: #ff6b4a; text-shadow: 0 7px 0 #1b1410; }
  .big { font-size: 150px; line-height: 1; text-shadow: 0 9px 0 #1b1410; }
  .rec { font-size: 38px; color: #ffd84a; margin-top: 6px; min-height: 46px; }
  .lines { margin-top: 18px; font: 700 30px system-ui, sans-serif; text-align: left; background: rgba(27,20,16,.8); border-radius: 22px; padding: 14px 34px; min-width: 420px; }
  .lines div { display: flex; justify-content: space-between; gap: 30px; padding: 3px 0; }
  .lines b { color: #ffd84a; }
  /* Garaje */
  .top { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 30px 30px 10px; box-sizing: border-box; font-size: 46px; }
  .back { font-size: 34px; padding: 12px 26px; margin: 0; }
  .cars { width: 100%; flex: 1; overflow-y: auto; padding: 10px 26px 40px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-content: start; }
  .car { background: rgba(27,20,16,.88); border: 5px solid rgba(255,255,255,.15); border-radius: 26px; padding: 14px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .car.sel { border-color: #ffd84a; }
  .car img { height: 210px; margin: 6px 0; }
  .car .n { font-size: 32px; }
  .car .d { font: 700 22px system-ui, sans-serif; color: #e9e6dc; text-align: center; min-height: 56px; }
  .car .p { font-size: 30px; color: #ffd84a; margin-top: 6px; }
  .car.lock img { filter: brightness(.35); }
  .det { width: 100%; box-sizing: border-box; padding: 18px 30px 34px; background: rgba(27,20,16,.95); border-top: 5px solid #ffd84a; }
  .det h3 { margin: 0 0 10px; font-size: 40px; }
  .up { display: flex; align-items: center; justify-content: space-between; font: 700 26px system-ui, sans-serif; margin: 10px 0; gap: 14px; }
  .up .dots { color: #ffd84a; font-size: 30px; letter-spacing: 4px; }
  .up .btn { font-size: 26px; padding: 10px 22px; margin: 0; box-shadow: 0 5px 0 #a8761a; min-width: 170px; }
  .up .btn[disabled] { background: #6b665c; box-shadow: 0 5px 0 #3e3a34; color: #ccc; }
  .rsel { margin-top: 44px; display: flex; align-items: center; gap: 16px; }
  .rsel .ruta { margin-top: 0; min-width: 330px; text-align: center; }
  .ruta.lock { border-color: #6b665c; color: #9a958a; }
  .arw { pointer-events: auto; border: 0; background: rgba(27,20,16,.85); color: #ffd84a; font-size: 40px; width: 74px; height: 74px; border-radius: 40px; cursor: pointer; font-family: inherit; }
  .arw:disabled { opacity: .25; }
  .mis { margin-top: 26px; width: 600px; background: rgba(27,20,16,.85); border-radius: 22px; padding: 12px 22px; font: 700 24px system-ui, sans-serif; }
  .mis h4 { margin: 0 0 6px; font: 400 28px "Arial Black", Impact, sans-serif; color: #ffd84a; }
  .mi { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; align-items: center; }
  .bar { width: 150px; height: 14px; background: #3e3a34; border-radius: 8px; overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; background: #ffd84a; }
  .mi.done { color: #3fd17a; }
  .news { margin-top: 18px; font: 700 26px system-ui, sans-serif; color: #ffd84a; text-align: center; min-height: 30px; }
  .more { margin-top: 18px; font: 700 26px system-ui, sans-serif; color: #e9e6dc; pointer-events: auto; }
  .list { width: 100%; flex: 1; overflow-y: auto; padding: 10px 26px 40px; box-sizing: border-box; }
  .ach { display: flex; align-items: center; gap: 16px; background: rgba(27,20,16,.88); border-radius: 22px; padding: 12px 18px; margin-bottom: 12px; }
  .ach .md { font-size: 42px; letter-spacing: 2px; min-width: 150px; }
  .ach .md .off { filter: grayscale(1) brightness(.4); }
  .ach b { font-size: 28px; display: block; }
  .ach small { font: 700 22px system-ui, sans-serif; color: #e9e6dc; }
  #toast { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); background: #1b1410; color: #ffd84a; border-radius: 26px; padding: 18px 34px; font-size: 36px; display: none; pointer-events: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
  <div id="menu" class="scr shade">
    <div class="logo">RUTA<span>LOCA</span></div>
    <div class="rsel"><button class="arw" id="r-prev">◀</button><div class="ruta" id="r-card">RUTA 1<small>Ciudad de México</small></div><button class="arw" id="r-next">▶</button></div>
    <div class="stats"><div class="pill">🏆 <span id="m-best">0</span> m</div><div class="pill">🪙 <span id="m-coins">0</span></div></div>
    <button class="btn" id="b-play">¡JUGAR!</button>
    <div class="row"><button class="btn sec" id="b-garage">🔧 Garaje</button><button class="btn sec" id="b-logros">🏅</button><button class="btn sec" id="b-stats">📊</button><button class="btn sec" id="b-sound">🔊</button></div>
    <div class="mis" id="m-mis"></div>
    <div class="ver" id="ver"></div>
  </div>
  <div id="over" class="scr shade">
    <div class="over-t" id="o-title">¡CHOCASTE!</div>
    <div class="big" id="o-m">0 m</div>
    <div class="rec" id="o-rec"></div>
    <div class="lines" id="o-lines"></div>
    <button class="btn" id="b-again">OTRA VEZ</button>
    <div class="row"><button class="btn sec" id="b-ogarage">🔧 Garaje</button><button class="btn sec" id="b-menu">Menú</button></div>
    <div class="news" id="o-news"></div>
    <a class="more" id="b-more" href="https://darkshadow-studios.com/?src=ruta" target="_blank" rel="noopener">Más juegos del estudio ›</a>
  </div>
  <div id="garage" class="scr shade" style="background: rgba(10,8,6,.86)">
    <div class="top"><button class="btn sec back" id="b-gback">◀</button><div>GARAJE</div><div class="pill" style="font-size:32px">🪙 <span id="g-coins">0</span></div></div>
    <div class="cars" id="cars"></div>
    <div class="det" id="det"></div>
  </div>
  <div id="logros" class="scr shade" style="background: rgba(10,8,6,.88)">
    <div class="top"><button class="btn sec back" id="b-lback">◀</button><div>LOGROS</div><div class="pill" style="font-size:30px" id="l-count"></div></div>
    <div class="list" id="l-list"></div>
  </div>
  <div id="stats" class="scr shade" style="background: rgba(10,8,6,.88)">
    <div class="top"><button class="btn sec back" id="b-sback">◀</button><div>ESTADÍSTICAS</div><div style="width:90px"></div></div>
    <div class="lines" id="s-list" style="min-width:600px;margin-top:20px"></div>
  </div>
  <div id="pause" class="scr shade" style="justify-content:center"><div class="big" style="font-size:90px">PAUSA</div><div class="rec">Toca para seguir</div></div>
  <div id="toast"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
